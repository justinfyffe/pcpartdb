map $http_user_agent $limit_ai_bot {
        default "";
        "meta-externalagent/1.1 (+https://developers.facebook.com/docs/sharing/webmasters/crawler)" $http_user_agent;
        "meta-externalagent/1.1" $http_user_agent;
        ~*ClaudeBot $http_user_agent;
    }

limit_req_zone $limit_ai_bot zone=aibots:10m rate=5r/m;

server {
        server_name pcpartdb.com;
        root /srv/web/pcpartdb/packages/website/public;

        listen 443 ssl http2;
        listen [::]:443 ssl ipv6only=on http2;

        ssl_certificate /etc/cloudflare/certs/cert.pem;
        ssl_certificate_key /etc/cloudflare/certs/key.pem;

        client_max_body_size 10M;

        if ($http_user_agent ~* (Bytespider|PetalBot) ) {
                return 403;
        }

        location / {
          limit_req zone=aibots burst=5 nodelay;
          limit_req_status 429;

          proxy_pass http://localhost:3010;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Connection 'upgrade';
          proxy_set_header Host $http_host;
          proxy_http_version 1.1;
          proxy_set_header X-NginX-Proxy true;
          proxy_set_header Upgrade $http_upgrade;
          proxy_cache_bypass $http_upgrade;
          proxy_redirect off;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
}

server {
        server_name www.pcpartdb.com;

        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        return 301 https://pcpartdb.com$request_uri;
}

server {
        server_name _;

        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;

        ssl_certificate /etc/cloudflare/certs/cert.pem;
        ssl_certificate_key /etc/cloudflare/certs/key.pem;

        return 301 https://pcpartdb.com$request_uri;
}
