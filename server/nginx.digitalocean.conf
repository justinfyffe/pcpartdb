server {
        server_name pcpartdb.com;
        root /srv/web/pcpartdb/packages/website/public;

        client_max_body_size 10M; # Max upload size.

        if ($http_user_agent ~* (Bytespider|PetalBot) ) {
                return 403;
        }

        location / {
                proxy_pass http://localhost:3010;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $http_host;
                proxy_http_version 1.1;
                proxy_set_header X-NginX-Proxy true;
                proxy_set_header Upgrade $http_upgrade;
                proxy_cache_bypass $http_upgrade;
                proxy_redirect off;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        listen [::]:443 ssl ipv6only=on http2; # managed by Certbot
        listen 443 ssl http2; # managed by Certbot
        ssl_certificate /etc/letsencrypt/live/pcpartdb.com/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/pcpartdb.com/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name www.pcpartdb.com;
        return 301 https://pcpartdb.com$request_uri;
}

server {
        if ($host = www.pcpartdb.com) {
                return 301 https://pcpartdb.com$request_uri;
        }


        if ($host = pcpartdb.com) {
                return 301 https://pcpartdb.com$request_uri;
        }


        listen 80;
        listen [::]:80;
        server_name pcpartdb.com www.pcpartdb.com;

        return 404; # managed by Certbot
}

server {
        server_name _;

        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;

        ssl_certificate /etc/cloudflare/certs/cert.pem;
        ssl_certificate_key /etc/cloudflare/certs/key.pem;

        return 301 https://pcpartdb.com$request_uri;
}
